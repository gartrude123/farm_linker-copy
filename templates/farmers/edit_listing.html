{% extends "base.html" %}
{% block title %}Edit Listing{% endblock %}

{% block content %}
<section class="page-header">
  <div class="page-title">
    <i class="fas fa-pen"></i>
    <h1>Edit Listing</h1>
    <p>Update your produce details</p>
  </div>
</section>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('farmer.edit_listing', id=listing._id) }}" class="ajax-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Crop Name <span class="req">*</span></label>
          <input type="text" name="cropName" value="{{ listing.cropName }}" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category">
            <option value="">Select Category</option>
            <option value="Vegetables" {% if listing.category == 'Vegetables' %}selected{% endif %}>Vegetables</option>
            <option value="Fruits" {% if listing.category == 'Fruits' %}selected{% endif %}>Fruits</option>
            <option value="Grains" {% if listing.category == 'Grains' %}selected{% endif %}>Grains</option>
            <option value="Tubers" {% if listing.category == 'Tubers' %}selected{% endif %}>Tubers</option>
            <option value="Legumes" {% if listing.category == 'Legumes' %}selected{% endif %}>Legumes</option>
            <option value="Herbs & Spices" {% if listing.category == 'Herbs & Spices' %}selected{% endif %}>Herbs & Spices</option>
            <option value="Cash Crops" {% if listing.category == 'Cash Crops' %}selected{% endif %}>Cash Crops</option>
            <option value="Other" {% if listing.category == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Quantity</label>
          <input type="number" name="quantity" value="{{ listing.quantity }}" min="0" step="0.1">
        </div>
        <div class="form-group">
          <label>Unit</label>
          <input type="text" name="unit" value="{{ listing.unit }}">
        </div>
        <div class="form-group">
          <label>Price per Unit</label>
          <input type="number" name="pricePerUnit" value="{{ listing.pricePerUnit }}" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Harvest Date</label>
          <input type="date" name="harvestDate" value="{{ listing.harvestDate or '' }}">
        </div>
        <div class="form-group">
          <label>Expiry Date</label>
          <input type="date" name="expiryDate" value="{{ listing.expiryDate or '' }}">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" rows="3">{{ listing.description or '' }}</textarea>
        </div>
      </div>
      <div class="modal-actions" style="border-top:none; background:transparent; padding-top:0;">
        <a href="{{ url_for('farmer.listings') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
