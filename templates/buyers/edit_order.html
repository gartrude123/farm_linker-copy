{% extends "base.html" %}
{% block title %}Edit Order{% endblock %}

{% block content %}
<section class="page-header">
  <div class="page-title">
    <i class="fas fa-pen"></i>
    <h1>Edit Order</h1>
    <p>Update your pending order</p>
  </div>
</section>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('buyer.edit_order', id=order._id) }}" class="ajax-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Quantity Ordered</label>
          <input type="number" name="quantityOrdered" value="{{ order.quantityOrdered }}" min="0" step="0.1">
        </div>
        <div class="form-group">
          <label>Total Price</label>
          <input type="number" name="totalPrice" value="{{ order.totalPrice }}" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select name="paymentMethod">
            <option value="MTN MoMo" {% if order.paymentMethod == 'MTN MoMo' %}selected{% endif %}>MTN MoMo</option>
            <option value="Airtel Money" {% if order.paymentMethod == 'Airtel Money' %}selected{% endif %}>Airtel Money</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payment Date</label>
          <input type="date" name="paymentDate" value="{{ order.paymentDate or '' }}">
        </div>
        <div class="form-group">
          <label>Delivery Method</label>
          <select name="deliveryMethod">
            <option value="Pickup" {% if order.deliveryMethod == 'Pickup' %}selected{% endif %}>Pickup</option>
            <option value="Delivery" {% if order.deliveryMethod == 'Delivery' %}selected{% endif %}>Delivery</option>
            <option value="Courier" {% if order.deliveryMethod == 'Courier' %}selected{% endif %}>Courier</option>
          </select>
        </div>
      </div>
      <div class="modal-actions" style="border-top:none; background:transparent; padding-top:0;">
        <a href="{{ url_for('buyer.orders') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
